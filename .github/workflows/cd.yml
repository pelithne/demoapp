name: CD - Deploy to Azure

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI - Build and Test"]
    branches: [feature/*, develop]
    types: [completed]

env:
  AZURE_RESOURCE_GROUP: rg-catvdog-dev
  AZURE_LOCATION: eastus
  CONTAINER_REGISTRY: catdogvoting.azurecr.io

jobs:
  # Deploy infrastructure
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.workflow_run.conclusion == 'success'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Create Resource Group
      run: |
        az group create \
          --name ${{ env.AZURE_RESOURCE_GROUP }} \
          --location ${{ env.AZURE_LOCATION }}
          
    - name: Deploy Bicep template (Preview)
      run: |
        az deployment group what-if \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam
          
    - name: Deploy Bicep template
      run: |
        az deployment group create \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam
      env:
        DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
        
    outputs:
      backend_url: ${{ steps.deploy.outputs.backendUrl }}
      frontend_url: ${{ steps.deploy.outputs.frontendUrl }}

  # Build and push container images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Build and push backend image
      run: |
        # Get ACR login server
        ACR_LOGIN_SERVER=$(az acr show --name catdogvoting --query loginServer --output tsv)
        
        # Build and push backend
        az acr build \
          --registry catdogvoting \
          --image backend:${{ github.sha }} \
          --image backend:latest \
          --file backend/Dockerfile \
          backend/
          
    - name: Build and push frontend image  
      run: |
        # Build and push frontend
        az acr build \
          --registry catdogvoting \
          --image frontend:${{ github.sha }} \
          --image frontend:latest \
          --file frontend/Dockerfile \
          frontend/

  # Deploy application to Container Apps
  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-and-push]
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ needs.deploy-infrastructure.outputs.frontend_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Get deployment outputs
      id: outputs
      run: |
        DEPLOYMENT_OUTPUTS=$(az deployment group show \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name main \
          --query properties.outputs)
        
        echo "backend_app_name=$(echo $DEPLOYMENT_OUTPUTS | jq -r .backendAppName.value)" >> $GITHUB_OUTPUT
        echo "frontend_app_name=$(echo $DEPLOYMENT_OUTPUTS | jq -r .frontendAppName.value)" >> $GITHUB_OUTPUT
        echo "acr_name=$(echo $DEPLOYMENT_OUTPUTS | jq -r .storageAccountName.value | sed 's/storage/acr/')" >> $GITHUB_OUTPUT
        
    - name: Update backend container app
      run: |
        az containerapp update \
          --name ${{ steps.outputs.outputs.backend_app_name }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image ${{ env.CONTAINER_REGISTRY }}/backend:${{ github.sha }}
          
    - name: Update frontend container app
      run: |
        az containerapp update \
          --name ${{ steps.outputs.outputs.frontend_app_name }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image ${{ env.CONTAINER_REGISTRY }}/frontend:${{ github.sha }}

  # Run smoke tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-application
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install test dependencies
      run: npm install -g @playwright/test
      
    - name: Run smoke tests
      run: |
        cd e2e-tests
        npm ci
        npx playwright test smoke.spec.ts
      env:
        BASE_URL: ${{ needs.deploy-infrastructure.outputs.frontend_url }}
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smoke-test-results
        path: e2e-tests/test-results/